<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ARC raid session report mockup</title>
  <desc id="desc">Illustrative Advanced Raid Check session report populated with dummy data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#080b0f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #d9e0e5; }
      .title { font-size: 25px; font-weight: 650; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #5bd0d6; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .muted { fill: #7f909a; }
      .ok { fill: #70d18b; }
      .bad { fill: #ff6b6b; }
      .warn { fill: #edc45a; }
      .cyan { fill: #5bd0d6; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="180" fill="#20a7af" opacity=".05"/>
  <g filter="url(#shadow)">
    <rect x="70" y="42" width="1060" height="610" rx="5" fill="#0b1014" stroke="#31434d" stroke-width="2"/>
    <rect x="71" y="43" width="1058" height="55" rx="4" fill="#152129"/>
    <rect x="71" y="94" width="1058" height="4" fill="#24a6ad"/>
  </g>
  <rect x="91" y="58" width="25" height="25" rx="4" fill="#24a6ad"/>
  <path d="M98 78l5-15h4l5 15h-4l-1-4h-5l-1 4zm5-7h3l-1.5-5z" fill="#071015"/>
  <text x="129" y="80" class="title">ARC — Raid Session Report</text>
  <text x="1090" y="77" text-anchor="end" class="small muted">Dummy session · 02 Sep 2026</text>

  <rect x="91" y="117" width="1018" height="73" rx="3" fill="#111a20" stroke="#273943"/>
  <text x="111" y="142" class="section">SIEGE OF ORGRIMMAR · 10 HEROIC</text>
  <text x="111" y="169" class="body">Duration <tspan class="cyan">2h 43m</tspan></text>
  <text x="310" y="169" class="body">Pulls <tspan class="cyan">14</tspan></text>
  <text x="430" y="169" class="body">Kills <tspan class="ok">6</tspan></text>
  <text x="550" y="169" class="body">Boss combat <tspan class="cyan">54m</tspan></text>
  <text x="765" y="169" class="body">Trash combat <tspan class="cyan">48m</tspan></text>
  <text x="980" y="169" class="body">Checks <tspan class="cyan">9</tspan></text>

  <rect x="91" y="207" width="488" height="337" rx="3" fill="#0f161b" stroke="#273943"/>
  <text x="111" y="236" class="section">BOSSES</text>
  <text x="111" y="266" class="small muted">ENCOUNTER</text>
  <text x="350" y="266" class="small muted">PULLS</text>
  <text x="425" y="266" class="small muted">RESULT</text>
  <text x="505" y="266" class="small muted">TIME</text>
  <line x1="111" y1="278" x2="557" y2="278" stroke="#273943"/>
  <g class="body">
    <text x="111" y="307">Immerseus</text><text x="367" y="307">1</text><text x="425" y="307" class="ok">Kill</text><text x="505" y="307">05:18</text>
    <text x="111" y="345">Fallen Protectors</text><text x="367" y="345">2</text><text x="425" y="345" class="ok">Kill</text><text x="505" y="345">08:41</text>
    <text x="111" y="383">Norushen</text><text x="367" y="383">3</text><text x="425" y="383" class="ok">Kill</text><text x="505" y="383">07:12</text>
    <text x="111" y="421">Sha of Pride</text><text x="367" y="421">2</text><text x="425" y="421" class="ok">Kill</text><text x="505" y="421">06:54</text>
    <text x="111" y="459">Galakras</text><text x="367" y="459">1</text><text x="425" y="459" class="ok">Kill</text><text x="505" y="459">09:36</text>
    <text x="111" y="497">Iron Juggernaut</text><text x="367" y="497">5</text><text x="425" y="497" class="bad">Wipe</text><text x="505" y="497">—</text>
  </g>

  <rect x="596" y="207" width="513" height="337" rx="3" fill="#0f161b" stroke="#273943"/>
  <text x="616" y="236" class="section">ATTENDANCE &amp; ACTIVITY</text>
  <text x="616" y="266" class="small muted">PLAYER</text>
  <text x="785" y="266" class="small muted">PRESENT</text>
  <text x="875" y="266" class="small muted">AFK FLAG</text>
  <text x="970" y="266" class="small muted">TRASH IDLE</text>
  <line x1="616" y1="278" x2="1088" y2="278" stroke="#273943"/>
  <g class="body">
    <text x="616" y="307">Tankadin</text><text x="795" y="307" class="ok">100%</text><text x="895" y="307">0m</text><text x="992" y="307">0m 24s</text>
    <text x="616" y="345">Healme</text><text x="795" y="345" class="ok">100%</text><text x="895" y="345">0m</text><text x="992" y="345">1m 03s</text>
    <text x="616" y="383">Shadowbob</text><text x="795" y="383" class="ok">100%</text><text x="895" y="383">0m</text><text x="992" y="383" class="warn">4m 18s ~</text>
    <text x="616" y="421">Afkmage</text><text x="795" y="421" class="ok">100%</text><text x="895" y="421" class="bad">8m 12s</text><text x="992" y="421" class="bad">11m 37s ~</text>
    <text x="616" y="459">Arrowgirl</text><text x="795" y="459" class="warn">82%</text><text x="895" y="459">0m</text><text x="992" y="459">2m 05s ~</text>
    <text x="616" y="497">Frostbite</text><text x="795" y="497" class="ok">100%</text><text x="895" y="497">0m</text><text x="992" y="497">0m 51s</text>
  </g>

  <rect x="91" y="562" width="1018" height="65" fill="#10171c" stroke="#273943"/>
  <rect x="110" y="579" width="116" height="31" rx="3" fill="#4b2225" stroke="#a55156"/>
  <text x="168" y="600" text-anchor="middle" class="small bad" font-weight="700">END SESSION</text>
  <rect x="238" y="579" width="160" height="31" rx="3" fill="#19343d" stroke="#35707c"/>
  <text x="318" y="600" text-anchor="middle" class="small cyan" font-weight="700">SELECT ALL FOR COPY</text>
  <rect x="827" y="579" width="78" height="31" rx="3" fill="#18242b" stroke="#3b4e58"/>
  <text x="866" y="600" text-anchor="middle" class="small">PREVIOUS</text>
  <rect x="917" y="579" width="62" height="31" rx="3" fill="#18242b" stroke="#3b4e58"/>
  <text x="948" y="600" text-anchor="middle" class="small">NEXT</text>
  <rect x="991" y="579" width="98" height="31" rx="3" fill="#18242b" stroke="#3b4e58"/>
  <text x="1040" y="600" text-anchor="middle" class="small">REFRESH</text>

  <text x="600" y="682" text-anchor="middle" class="small muted">Illustrative mockup — all names and values are dummy data</text>
</svg>
