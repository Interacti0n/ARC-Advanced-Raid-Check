name: Package ARC release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Check syntax and run addon tests
        run: |
          for file in ./*.lua tests/player_check.lua; do
            luac5.1 -p "$file"
          done
          lua5.1 tests/player_check.lua
          lua5.1 tests/player_check.lua --stale-toc
      - name: Test release tooling
        run: python3 -B -m unittest discover -s tests -p 'test_release.py' -v
      - name: Validate version and build ZIP
        env:
          ARC_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 -B scripts/package_release.py --tag "$ARC_RELEASE_TAG"

  publish:
    name: Attach ZIP to the published release
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rebuild verified package from the same commit
        env:
          ARC_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 -B scripts/package_release.py --tag "$ARC_RELEASE_TAG"
      - name: Upload package and fill empty release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARC_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 -B scripts/publish_release.py "$ARC_RELEASE_TAG"
